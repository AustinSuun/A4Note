[package]
name = "a4note"
version = "0.1.3"
description = "A4 Note knowledge workspace desktop app"
authors = ["A4 Note"]
edition = "2021"

[lib]
name = "a4note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
pdf-extract = "0.7"
sha2 = "0.10"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Opt-in browser capture bridge (no external runtime process).
axum = "0.8"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
lopdf = "0.34"
chrono = { version = "0.4", default-features = false, features = ["std"] }

base64 = "0.22"
