function captureZoomAnchor(event){const surface=$('surface'),bounds=surface.getBoundingClientRect(),x=event?.clientX??bounds.left+surface.clientWidth/2,y=event?.clientY??bounds.top+Math.min(160,surface.clientHeight/2),element=document.elementFromPoint(x,y),row=element?.closest('.matrix-row');if(!row||!matrixState)return null;const rect=row.getBoundingClientRect(),cell=element.closest('[data-cell]'),anchor={id:row.dataset.row,ratio:Math.max(0,Math.min(1,(y-rect.top)/rect.height)),y:y-bounds.top};if(cell){const r=cell.getBoundingClientRect();anchor.column=cell.dataset.cell;anchor.x=x-bounds.left;anchor.xRatio=(x-r.left)/r.width}return anchor}

function changeZoom(value,anchor=null){render.keepAnchor=true;zoomAnchor=anchor;zoom=Math.max(40,Math.min(200,value));render()}
function queueWheelZoom(e){if(!zoomFrame){zoomAnchor=captureZoomAnchor(e);pendingZoom=zoom;zoomFrame=requestAnimationFrame(()=>{const anchor=zoomAnchor;zoomFrame=0;const next=pendingZoom;pendingZoom=null;changeZoom(next,anchor)})}pendingZoom=Math.max(40,Math.min(200,pendingZoom+(e.deltaY>0?-5:5)))}
function focus(paperId){focusId=paperId;view='overview';zoom=150;render();$('surface').scrollTop=0;$('surface').scrollLeft=0;toast('已聚焦单篇；点击“返回当前范围”继续比较')}
function closeDialog(){$('overlay').innerHTML=''}
function modal(title,subtitle,body,save){$('overlay').innerHTML=`<div class="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><div><h3 id="dialogTitle">${esc(title)}</h3><p>${esc(subtitle)}</p></div><button aria-label="取消编辑" id="dialogX">✕</button></div><div class="dialog-body">${body}</div><div class="dialog-footer"><button class="button" id="dialogCancel">取消</button><button class="button primary" id="dialogSave">应用到演示总结</button></div></section></div>`;$('dialogX').onclick=$('dialogCancel').onclick=closeDialog;$('dialogSave').onclick=save;setTimeout(()=>$('overlay').querySelector('textarea,select,input,button')?.focus(),0)}
function editCell(paperId,colId){const p=papers.find(p=>p.id===paperId),c=columns.find(c=>c.id===colId);let value=fieldValue(p,c);const save=next=>{if(c.source)p[c.source]=next;else records[p.id][c.id]=next;recordRevision++;dirty=true;$('overlay').innerHTML='';render();toast('已更新演示记录；不修改原笔记。可导出保留本次内容')};if(c.kind==='text'){modal(c.name,p.title+(c.source?' · 文献元信息（演示）':' · 独立总结'),`<textarea id="cellInput" aria-label="总结内容" placeholder="总结这篇论文最值得记住的信息…">${esc(value||'')}</textarea><p class="help">${c.source?'此字段来自文献元信息，不重复保存到总结。online 时间仅填已确认的上线日期，可按年、月或日填写，未知留空。原型只修改演示数据。':'此处是独立总结，不会覆盖阅读笔记。支持多行文本。'}</p>`,()=>save($('cellInput').value))}
else if(c.kind==='note'){modal('关联阅读笔记',p.title,`<select id="noteSelect" aria-label="关联的笔记"><option value="">不关联</option>${p.notes.map(n=>`<option value="${n.id}" ${value===n.id?'selected':''}>${esc(n.title)}</option>`).join('')}</select><p class="help">关联保存笔记ID，不复制正文。${p.notes.length?'综览直接展示被引用的内容。':'这篇演示论文还没有阅读笔记，可改用独立文字列写总结。'}</p>`,()=>save($('noteSelect').value))}
else {let next=value;modal(c.name,p.title,`${c.kind==='mixed'?`<label for="structureText">结构文字</label><textarea id="structureText" aria-label="结构文字" style="min-height:110px" placeholder="模型组成、连接关系、冻结/训练模块…">${esc(value?.text||'')}</textarea>`:''}<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" aria-label="选择框架图"><div id="figurePreview" class="figure-preview">${picture(next,p)||'<span class="help">选择一张PNG、JPEG或WebP图片</span>'}</div><input type="text" id="imageCaption" aria-label="框架图说明" placeholder="图示说明（可选）" value="${esc(value?.caption||'')}"><button type="button" id="removePicture" class="button small">移除图片，保留文字</button><p class="help">演示中只在本页载入图片，单张不超过3MB；正式版应使用资料库托管附件。</p>`,()=>{if(c.kind==='mixed')next={...next,text:$('structureText').value};if(next)next={...next,caption:$('imageCaption').value};save(next||null)});$('removePicture').onclick=()=>{next=c.kind==='mixed'?{text:$('structureText').value}:null;$('figurePreview').innerHTML='<span class="help">未附图片</span>';$('imageInput').value=''};$('imageInput').onchange=event=>{const file=event.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>3*1024*1024){toast('请选择不超过3MB的PNG/JPEG/WebP图片');return}const input=event.target,reader=new FileReader();$('dialogSave').disabled=true;$('removePicture').disabled=true;reader.onload=()=>{if($('imageInput')!==input)return;next={data:reader.result};$('figurePreview').innerHTML=picture(next,p);$('dialogSave').disabled=false;$('removePicture').disabled=false};reader.onerror=()=>{if($('imageInput')!==input)return;$('dialogSave').disabled=false;$('removePicture').disabled=false;toast('图片读取失败，请重新选择')};reader.readAsDataURL(file)}}}
let customColumnSequence=0;
function resetDefaultColumns(){modal('恢复默认列','只恢复展示，不覆盖任何总结内容。','<p class="help">恢复默认列名、顺序、宽度与显示状态。已添加的自定义列保留在后方，已移除的自定义列仍可单独恢复。</p>',()=>{const ids=new Set(defaultColumns.map(c=>c.id));const next=[...defaultColumns.map(c=>({...c})),...columns.filter(c=>!ids.has(c.id))];if(next.length>20)return toast('请先移除部分自定义列；原型最多支持20列');columns=next;archivedColumns=archivedColumns.filter(c=>!ids.has(c.id));dirty=true;closeDialog();render();drawColumns()})}
function showColumns(){columnPopup=!columnPopup;if(!columnPopup){$('popover').innerHTML='';return}drawColumns()}
function drawColumns(){ $('popover').innerHTML=`<section class="floating" aria-label="列设置"><h3>组织你的综览列 <button id="closeColumns" style="float:right" aria-label="关闭列设置">✕</button></h3><p class="help">论文名称固定。默认采用参考表；列布局独立于左侧筛选范围。</p>${columns.map((c,i)=>`<div class="column-setting"><input type="checkbox" data-visible="${c.id}" aria-label="显示${esc(c.name)}" ${!c.hidden?'checked':''}><span class="name">${esc(c.name)}</span><button data-up="${c.id}" ${i===0?'disabled':''} aria-label="上移${esc(c.name)}">↑</button><button data-down="${c.id}" ${i===columns.length-1?'disabled':''} aria-label="下移${esc(c.name)}">↓</button><button data-rename="${c.id}" title="重命名列">✎</button><button data-remove-column="${c.id}" aria-label="移除${esc(c.name)}">×</button></div>`).join('')}<div class="add-col"><input id="columnName" placeholder="新列名称" aria-label="新列名称" maxlength="24"><select id="columnKind" aria-label="新列类型"><option value="text">文字</option><option value="image">图片</option><option value="mixed">文字＋图片</option><option value="note">笔记引用</option></select><button class="button small" id="addColumn">＋</button></div><p class="help">隐藏或移除列均不删除总结内容；拖动表头排序、拖动列边调宽。核心方法和笔记引用可按需启用。</p><button class="button small" id="resetColumns">恢复默认列</button>${archivedColumns.length?`<details><summary class="help">已移除列（${archivedColumns.length}）</summary>${archivedColumns.map(c=>`<div class="column-setting"><span class="name">${esc(c.name)}</span><button data-restore-column="${c.id}">恢复</button></div>`).join('')}</details>`:''}</section>`;$('closeColumns').onclick=showColumns;$('addColumn').onclick=()=>{const name=$('columnName').value.trim();if(!name)return $('columnName').focus();if(columns.length>=20)return toast('原型最多支持20列');columns.push({id:'custom-'+(++customColumnSequence),name,kind:$('columnKind').value,width:270});dirty=true;render();drawColumns()}}
function moveToFolder(){if(!selected.size)return;modal('整理到文件夹',`移动选中的 ${selected.size} 篇论文，沿用现有单文件夹分类，不创建副本或专题。`,`<select id="moveFolder" aria-label="目标文件夹">${folders.map(f=>`<option>${esc(f)}</option>`).join('')}</select><p class="help">正式版应调用现有的文献移动接口；此原型只修改演示分类。</p>`,()=>{const target=$('moveFolder').value;papers.filter(p=>selected.has(p.id)).forEach(p=>p.folder=target);scope={type:'folder',value:target};tag='';query='';$('search').value='';resetFocus();dirty=true;$('overlay').innerHTML='';render();toast('已移至演示文件夹：'+target)})}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.quick){scope={type:'quick',value:t.dataset.quick};resetFocus();render()}if(t.dataset.folder){scope={type:'folder',value:t.dataset.folder};resetFocus();render()}if(t.dataset.tag){tag=tag===t.dataset.tag?'':t.dataset.tag;resetFocus();render()}if(t.dataset.view){view=t.dataset.view;if(view==='list'){columnPopup=false;$('popover').innerHTML=''}render()}if(t.dataset.focus)focus(t.dataset.focus);if(t.dataset.edit)editCell(...t.dataset.edit.split(':'));if(t.dataset.up||t.dataset.down){const id=t.dataset.up||t.dataset.down,i=columns.findIndex(c=>c.id===id),j=i+(t.dataset.up?-1:1);[columns[i],columns[j]]=[columns[j],columns[i]];dirty=true;render();drawColumns()}if(t.dataset.rename){const c=columns.find(c=>c.id===t.dataset.rename);modal('重命名列','只修改列名称，不删除既有记录。',`<input type="text" id="renameInput" aria-label="列名称" value="${esc(c.name)}" maxlength="24">`,()=>{const name=$('renameInput').value.trim();if(!name)return;c.name=name;dirty=true;$('overlay').innerHTML='';render();drawColumns()})}if(t.id==='resetColumns')resetDefaultColumns();if(t.dataset.removeColumn){const c=columns.find(c=>c.id===t.dataset.removeColumn);modal('移除列',c.name,'<p class="help">只移除展示列，不删除任何总结内容。可在列设置的“已移除列”中恢复。</p>',()=>{columns=columns.filter(x=>x.id!==c.id);archivedColumns.push(c);dirty=true;closeDialog();render();drawColumns()})}if(t.dataset.restoreColumn){if(columns.length>=20)return toast('原型最多支持20列');const i=archivedColumns.findIndex(c=>c.id===t.dataset.restoreColumn);const c=archivedColumns.splice(i,1)[0];columns.push({...c,hidden:false});dirty=true;render();drawColumns()}if(t.id==='compare'){focusId=null;onlySelected=!onlySelected;view='overview';zoom=70;render()}if(t.id==='clearSelection'){selected.clear();onlySelected=false;render()}if(t.id==='exitFocus'){focusId=null;zoom=90;render()}if(t.id==='move')moveToFolder();if(t.id==='emptyReset')clearFilters()});
document.addEventListener('change',e=>{if(e.target.dataset.select){const id=e.target.dataset.select;selected.has(id)?selected.delete(id):selected.add(id);render()}if(e.target.id==='checkAll'){const a=scoped();a.forEach(p=>e.target.checked?selected.add(p.id):selected.delete(p.id));render()}if(e.target.dataset.visible){columns.find(c=>c.id===e.target.dataset.visible).hidden=!e.target.checked;dirty=true;render()}});
$('surface').addEventListener('dblclick',e=>{const c=e.target.closest('[data-cell]');if(c)editCell(c.dataset.paper,c.dataset.cell)});$('surface').addEventListener('keydown',e=>{const c=e.target.closest('[data-cell]');if(c&&e.key==='Enter'){e.preventDefault();editCell(c.dataset.paper,c.dataset.cell)}});
$('search').oninput=e=>{query=e.target.value;focusId=null;render()};$('sort').onchange=e=>{sort=e.target.value;render()};$('columns').onclick=showColumns;$('zoomValue').onclick=()=>changeZoom(60);$('zoomOut').onclick=()=>changeZoom(zoom-10);$('zoomIn').onclick=()=>changeZoom(zoom+10);$('fit').onclick=()=>{focusId=null;changeZoom(40)};
$('surface').addEventListener('wheel',e=>{if(view==='overview'&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(e.deltaY)queueWheelZoom(e)}else{zoomAnchor=null}},{passive:false});
$('zoomTools').addEventListener('wheel',e=>{if(view!=='overview'||!e.deltaY)return;e.preventDefault();const r=$('surface').getBoundingClientRect();queueWheelZoom({deltaY:e.deltaY,clientX:r.left+$('surface').clientWidth/2,clientY:r.top+Math.min(160,$('surface').clientHeight/2)})},{passive:false});
$('surface').addEventListener('pointerdown',()=>{zoomAnchor=null});
$('surface').addEventListener('keydown',e=>{if(['PageDown','PageUp','Home','End','ArrowDown','ArrowUp'].includes(e.key))zoomAnchor=null});
$('surface').addEventListener('scroll',()=>{if(scrollFrame)return;scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;renderVisibleRows()})});
new ResizeObserver(()=>renderVisibleRows()).observe($('surface'));
function clearFilters(){scope={type:'quick',value:'all'};tag='';query='';$('search').value='';resetFocus();render()};$('resetFilters').onclick=clearFilters;
$('newFolder').onclick=()=>{modal('新建文件夹','沿用现有文件夹分类，不增加专题集合。','<input type="text" id="folderName" aria-label="文件夹名称" placeholder="文件夹名称" maxlength="40">',()=>{const name=$('folderName').value.trim();if(!name)return;if(folders.includes(name))return toast('文件夹已存在');folders.push(name);dirty=true;$('overlay').innerHTML='';render();toast('已创建演示文件夹')})};

$('surface').addEventListener('pointerdown',e=>{const r=e.target.closest('[data-resize]');if(!r)return;e.preventDefault();e.stopPropagation();const c=columns.find(c=>c.id===r.dataset.resize),x=e.clientX,start=c.width;const move=ev=>{c.width=Math.max(160,Math.min(650,start+(ev.clientX-x)/(.32+zoom*.007)));render()},end=()=>{dirty=true;document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);render()};document.addEventListener('pointermove',move);document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end)});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({prototype:true,version:2,columns,archivedColumns,records,folders,papers:papers.map(p=>({id:p.id,title:p.title,online:p.online,venue:p.venue,folder:p.folder})),view,scope,tag,zoom},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='A4Note-文献库原型记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);render();toast('已发起导出；若预览阻止下载，请下载HTML后在浏览器中打开')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('overlay').innerHTML)closeDialog();else if(columnPopup)showColumns();else if(focusId){focusId=null;render()}}if(e.key==='Tab'&&$('overlay').innerHTML){const items=[...$('overlay').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}}});
