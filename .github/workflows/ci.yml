name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # Verify the actual supported desktop and native-host target; keep the full suite.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            apps/native-host -> target

      - name: Prepare NSIS compiler for isolated registration checks
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          if (-not (Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compiler)) { throw 'NSIS compiler unavailable' }
          "A4NOTE_NSIS_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run verification suite
        run: npm run verify
