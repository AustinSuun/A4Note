name: Release A4Note (signed Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check whether this version is already published
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plan.mjs
      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.publish == 'true'
      - name: Install dependencies
        if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - name: Require signing key
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY' }
      - name: Build signed paired packages
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          A4NOTE_RELEASE_NOTES: '新增白板（笔记与阅读器共用），白板与阅读器批注工具统一；新增Doc2X文献翻译插件（确认后一键安装CLI）；阅读器笔记支持属性区；左侧边缘悬停切换场景；资源管理器合并新建菜单并为各类文件提供右键菜单，文件标签页可预览图片与HTML；总览字段卡片按全局顺序拖拽排序并可直接编辑。修复界面缩放下弹窗与指针偏移、高亮与下划线对齐选中文字、窄窗口侧栏同步、从文献库打开的PDF返回原标签等问题。浏览器扩展升级至0.6.6，修正OpenReview页面PDF下载。更新前请备份重要资料。'
        run: |
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-capture-extension.mjs
          exit $LASTEXITCODE
      - name: Publish complete signed release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: A4Note-Windows-signed
          path: |
            artifacts/windows/latest/*
            artifacts/browser-extension/*.zip
          if-no-files-found: error
