name: Release A4Note (signed Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check whether this version is already published
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plan.mjs
      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.publish == 'true'
      - name: Install dependencies
        if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - name: Require signing key
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY' }
      - name: Build signed paired packages
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          A4NOTE_RELEASE_NOTES: '阅读器标注工具栏：图层入口高度与同排工具对齐、清理旧容器残边，工具栏恢复紧凑高度；精简阅读器笔记侧栏，标题栏改为书签边界按钮并支持覆盖菜单朝内容展开；修复彩虹树参考线缩放对齐并恢复垂直参考线；放大快捷键提示并保护内联面板；移除阅读清单展开/关闭按钮绿框；任务卡标题栏空白条可拖拽。另包含0.1.28排版改进：Markdown正文默认16px并收紧段落间距，修复脚注上标、返回定位和不透明预览，改进表格、选区、文末留白与图片控制，笔记文件树类型标签、紧凑双排悬浮栏与更轻毛玻璃，PDF交互与标注撤销/保存队列。更新前资料库备份不含外部Markdown文件，请先备份重要资料。配套浏览器插件0.6.5不变。'
        run: |
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-capture-extension.mjs
          exit $LASTEXITCODE
      - name: Publish complete signed release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: A4Note-Windows-signed
          path: |
            artifacts/windows/latest/*
            artifacts/browser-extension/*.zip
          if-no-files-found: error
