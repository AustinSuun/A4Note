name: Release A4Note (signed Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check whether this version is already published
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plan.mjs
      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.publish == 'true'
      - name: Install dependencies
        if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - name: Require signing key
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY' }
      - name: Build signed paired packages
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          A4NOTE_RELEASE_NOTES: '新增浏览器扩展 0.6.7：修正 IEEE Xplore 论文页面无法识别的问题（该站点不再提供 citation_* 元数据，改用 og/twitter/description 兜底识别，标题、作者、DOI 均能采集；受限正文仍只在浏览器中打开，绝不绕过付费墙）。阅读器新增 PDF 链接层：页内链接可跳转并高亮，提供「返回 第 N 页」返回栈（Alt+← 亦可，同页小距离跳转自动返回），外部链接经白名单在系统浏览器打开，不影响选区、高亮、查找与批注。文献库支持文件夹拖拽排序与层级调整：可拖入文件夹、拖到下方空白区回到顶层，顺序持久保存且升级后既有结构不变，默认资料库保持不可移动，环形与重名会明确提示。界面修复：总览「字段目录」对话框三列对齐重建（长字段名不再挤压，重命名行内完成，100/150/200% 缩放不溢出）；阅读器「笔记属性」移回正文列并置于标题之后；总览单元格 Markdown 真正渲染引用块与行内格式，不再显示字面的 > 符号。稳定性：修复 CI 架构校验与扩展打包两处失败，浏览器回归统一端口等待器以消除 Windows 偶发失败，并新增公开问题板入口。更新前请备份重要资料。'
        run: |
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-capture-extension.mjs
          exit $LASTEXITCODE
      - name: Publish complete signed release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: A4Note-Windows-signed
          path: |
            artifacts/windows/latest/*
            artifacts/browser-extension/*.zip
          if-no-files-found: error
