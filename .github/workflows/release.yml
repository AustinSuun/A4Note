name: Release A4Note (signed Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check whether this version is already published
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plan.mjs
      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.publish == 'true'
      - name: Install dependencies
        if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - name: Require signing key
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY' }
      - name: Build signed paired packages
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          A4NOTE_RELEASE_NOTES: 'Markdown 正文默认16px并收紧段落间距，保留原界面字号及已保存设置；引用/代码中文跟随正文字体；修复脚注上标、返回定位和不透明预览；改进表格、选区、文末留白与图片控制；笔记文件树类型标签、紧凑双排悬浮栏和更轻的毛玻璃；统一模式切换、适配窄宽阅读工具栏；改进PDF交互与标注撤销/保存队列；更新前资料库备份不含外部Markdown文件。配套浏览器插件0.6.5不变。'
        run: |
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-capture-extension.mjs
          exit $LASTEXITCODE
      - name: Publish complete signed release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: A4Note-Windows-signed
          path: |
            artifacts/windows/latest/*
            artifacts/browser-extension/*.zip
          if-no-files-found: error
