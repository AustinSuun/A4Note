name: 安装 / 升级问题
description: 装不上、装完打不开、升级失败、浏览器扩展不工作、原生消息宿主未连接。
title: "[安装] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        安装/升级类问题通常和系统环境强相关，**请务必贴上原文报错**，不要转述。
  - type: dropdown
    id: channel
    attributes:
      label: 安装方式
      options:
        - Windows 安装包（.exe / NSIS）
        - 从源码构建
        - 浏览器扩展（.zip 解包加载）
        - 其他（请在下方说明）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 安装包文件名或扩展页面显示的版本号，例如 0.1.34 / 扩展 0.6.7
      placeholder: "0.1.34 / 扩展 0.6.7"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 卡在哪一步
      options:
        - 下载/校验安装包
        - 安装过程报错
        - 装完启动失败或闪退
        - 升级后数据/设置异常
        - 扩展加载失败
        - 扩展装上了但采集不到网页信息
        - 其他
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 报错原文
      description: 原样粘贴错误文字、弹窗内容或命令行输出（有多长贴多长）。
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 系统环境
      description: 操作系统版本、是否管理员账户、杀毒/安全软件、是否在受限网络（公司代理/内网）下。
      placeholder: Windows 11 23H2，普通账户，火绒，公司代理
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认粘贴的内容不含私人笔记或任何凭据（如 token、密钥）
          required: true
