name: Bug 报告
description: 应用行为不对、崩溃、渲染/交互异常。请尽量填全，信息越全越可能被自动修复。
title: "[Bug] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。这个表单的字段会被自动化流程直接读取，**照实填**比写得多更重要。
        如果问题涉及隐私数据（笔记内容、本地路径、凭据），请先脱敏；安全问题请改用私密漏洞报告。
  - type: input
    id: version
    attributes:
      label: A4Note 版本
      description: 设置 → 关于 中的版本号，或安装包文件名，例如 0.1.34
      placeholder: "0.1.34"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - 其他（请在下方说明）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，一步一步写清楚；能稳定复现最好，偶发也请注明「偶发」。
      placeholder: |
        1. 打开资料库
        2. 右键某个文件夹 → 重命名
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: 我以为会发生……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？如果有报错文字或弹窗内容，请原样贴出。
      placeholder: 实际结果是……
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图 / 日志 / 录屏（可选）
      description: 直接拖入图片即可。请确认画面里没有你的私人笔记内容。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认以上内容不含私人笔记、本机路径中的敏感信息或任何凭据
          required: true
